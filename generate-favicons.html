<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Favicon Generator</title>
</head>
<body>
    <canvas id="canvas" width="512" height="512" style="display:none;"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Function to generate favicon at different sizes
        function generateFavicon(size) {
            canvas.width = size;
            canvas.height = size;
            
            // Clear canvas
            ctx.clearRect(0, 0, size, size);
            
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#8b4513');
            gradient.addColorStop(1, '#6b4423');
            
            // Draw rounded rectangle background
            const radius = size / 8;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.fill();
            
            // Draw border
            ctx.strokeStyle = 'rgba(255, 216, 155, 0.3)';
            ctx.lineWidth = size / 32;
            ctx.stroke();
            
            // Draw text
            const textGradient = ctx.createLinearGradient(0, 0, size, size);
            textGradient.addColorStop(0, '#d97236');
            textGradient.addColorStop(1, '#ffd89b');
            
            ctx.fillStyle = textGradient;
            ctx.font = `bold ${size * 0.5}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.letterSpacing = '-2px';
            
            // Add text shadow for depth
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = size / 20;
            ctx.shadowOffsetX = size / 40;
            ctx.shadowOffsetY = size / 40;
            
            ctx.fillText('RR', size / 2, size / 2);
            
            // Reset shadow
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            
            // Add accent dot
            ctx.fillStyle = '#29abe2';
            ctx.beginPath();
            ctx.arc(size / 2, size * 0.82, size / 25, 0, Math.PI * 2);
            ctx.fill();
            
            return canvas.toDataURL('image/png');
        }
        
        // Generate all required sizes
        const sizes = {
            'favicon-16x16.png': 16,
            'favicon-32x32.png': 32,
            'favicon-48x48.png': 48,
            'apple-touch-icon.png': 180,
            'android-chrome-192x192.png': 192,
            'android-chrome-512x512.png': 512
        };
        
        console.log('Favicon generation complete. Use the browser console to download.');
        console.log('To download, right-click each image below and save:');
        
        Object.entries(sizes).forEach(([filename, size]) => {
            const dataUrl = generateFavicon(size);
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            link.textContent = `Download ${filename}`;
            link.style.display = 'block';
            link.style.margin = '10px';
            document.body.appendChild(link);
            
            // Also display the image
            const img = document.createElement('img');
            img.src = dataUrl;
            img.style.margin = '10px';
            img.style.border = '1px solid #ccc';
            img.alt = filename;
            img.title = filename;
            document.body.appendChild(img);
            document.body.appendChild(document.createElement('br'));
        });
    </script>
</body>
</html>
