<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Rishi Raje - Digital Business Card</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        html {
            height: -webkit-fill-available;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(20px, -20px); }
            50% { transform: translate(-20px, 20px); }
            75% { transform: translate(20px, 10px); }
        }

        .card-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        .business-card {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            position: relative;
            overflow: hidden;
            animation: slideIn 0.6s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-bg {
            position: absolute;
            inset: 0;
            opacity: 0.1;
            background: radial-gradient(circle at 20% 80%, rgba(255,255,255,0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.2) 0%, transparent 50%);
        }

        .card-pattern {
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.03) 20px, rgba(255,255,255,0.03) 40px);
            animation: rotate 60s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 30px 15px;
        }

        .loading i {
            font-size: 2.5em;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .profile-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            color: white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 4px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .profile-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            to { left: 100%; }
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .name {
            font-size: 1.6em;
            font-weight: 800;
            color: white;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            word-break: break-word;
        }

        .title {
            font-size: 1em;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .company {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 25px 0;
            padding: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 1.3em;
            font-weight: 800;
            color: white;
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contact-info {
            margin: 20px 0;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 12px 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            min-height: 60px;
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(3px);
        }

        .contact-icon {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 1em;
        }

        .contact-text {
            flex: 1;
            min-width: 0;
        }

        .contact-label {
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 2px;
        }

        .contact-value {
            font-size: 0.9em;
            font-weight: 500;
            color: white;
            word-break: break-word;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            min-height: 48px;
            touch-action: manipulation;
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .action-btn.primary:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .action-btn.secondary:active {
            background: rgba(255, 255, 255, 0.25);
        }

        .save-contact-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .social-link {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            touch-action: manipulation;
        }

        .social-link:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.95);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: white;
            color: #1e3a8a;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            font-weight: 600;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: all 0.3s ease;
            max-width: 90%;
            font-size: 0.9em;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast i {
            color: #10b981;
            font-size: 1.2em;
        }

        /* Tablet styles */
        @media (min-width: 481px) {
            .business-card {
                padding: 35px 25px;
                border-radius: 24px;
            }

            .profile-image {
                width: 120px;
                height: 120px;
                font-size: 3em;
            }

            .name {
                font-size: 2em;
            }

            .title {
                font-size: 1.1em;
            }

            .stat-number {
                font-size: 1.5em;
            }

            .stat-label {
                font-size: 0.8em;
            }

            .action-buttons {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .save-contact-btn {
                grid-column: 1 / -1;
            }
        }

        /* Small mobile optimization */
        @media (max-width: 360px) {
            body {
                padding: 10px;
            }

            .business-card {
                padding: 20px 15px;
            }

            .profile-image {
                width: 80px;
                height: 80px;
                font-size: 2em;
            }

            .name {
                font-size: 1.4em;
            }

            .title {
                font-size: 0.9em;
            }

            .company {
                font-size: 0.85em;
            }

            .stat-number {
                font-size: 1.1em;
            }

            .stat-label {
                font-size: 0.65em;
            }

            .contact-item {
                padding: 10px;
                min-height: 56px;
            }

            .contact-icon {
                width: 32px;
                height: 32px;
                min-width: 32px;
                font-size: 0.9em;
            }

            .contact-value {
                font-size: 0.85em;
            }

            .action-btn {
                padding: 12px 16px;
                font-size: 0.9em;
            }

            .social-link {
                width: 44px;
                height: 44px;
                min-width: 44px;
                font-size: 1.1em;
            }
        }

        /* Landscape mobile */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 10px;
            }

            .business-card {
                padding: 20px 15px;
                max-height: 95vh;
                overflow-y: auto;
            }

            .profile-image {
                width: 70px;
                height: 70px;
                font-size: 1.8em;
                margin-bottom: 10px;
            }

            .profile-section {
                margin-bottom: 15px;
            }

            .stats {
                margin: 15px 0;
                padding: 15px 0;
            }

            .contact-item {
                min-height: 50px;
                padding: 8px 10px;
            }

            .social-links {
                margin-top: 15px;
                padding-top: 15px;
            }
        }

        /* Prevent zoom on input focus */
        @media screen and (max-width: 768px) {
            input, textarea, select, button {
                font-size: 16px !important;
            }
        }

        /* iOS safe area */
        @supports (padding: max(0px)) {
            body {
                padding-left: max(15px, env(safe-area-inset-left));
                padding-right: max(15px, env(safe-area-inset-right));
                padding-bottom: max(15px, env(safe-area-inset-bottom));
            }
        }

        /* Reduce animations on low-end devices */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <div class="card-container">
        <div class="business-card">
            <div class="card-bg"></div>
            <div class="card-pattern"></div>
            
            <div class="card-content">
                <div class="loading" id="loading">
                    <i class="fas fa-spinner"></i>
                    <p style="margin-top: 15px; font-size: 0.9em;">Loading your card...</p>
                </div>

                <div id="cardContent" style="display: none;">
                    <div class="profile-section">
                        <div class="profile-image" id="profileImage">
                            <i class="fas fa-user"></i>
                        </div>
                        <h1 class="name" id="name"></h1>
                        <p class="title" id="jobTitle"></p>
                        <p class="company" id="company"></p>
                    </div>

                    <div class="stats">
                        <div class="stat">
                            <span class="stat-number" id="statExp"></span>
                            <span class="stat-label">Years Exp</span>
                        </div>
                        <div class="stat">
                            <span class="stat-number" id="statCampaigns"></span>
                            <span class="stat-label">Campaigns</span>
                        </div>
                        <div class="stat">
                            <span class="stat-number" id="statRevenue"></span>
                            <span class="stat-label">Revenue</span>
                        </div>
                    </div>

                    <div class="contact-info">
                        <a href="#" class="contact-item" id="phoneLink">
                            <div class="contact-icon">
                                <i class="fas fa-phone"></i>
                            </div>
                            <div class="contact-text">
                                <span class="contact-label">Phone</span>
                                <span class="contact-value" id="phoneText"></span>
                            </div>
                        </a>

                        <a href="#" class="contact-item" id="emailLink">
                            <div class="contact-icon">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="contact-text">
                                <span class="contact-label">Email</span>
                                <span class="contact-value" id="emailText"></span>
                            </div>
                        </a>

                        <a href="#" class="contact-item" onclick="copyLocation(event)">
                            <div class="contact-icon">
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                            <div class="contact-text">
                                <span class="contact-label">Location</span>
                                <span class="contact-value" id="locationText"></span>
                            </div>
                        </a>
                    </div>

                    <div class="action-buttons">
                        <button class="action-btn save-contact-btn" onclick="saveContact()">
                            <i class="fas fa-download"></i>
                            Save Contact
                        </button>
                        <a href="#" class="action-btn primary" id="linkedinBtn">
                            <i class="fab fa-linkedin"></i>
                            LinkedIn
                        </a>
                        <button class="action-btn secondary" onclick="shareCard()">
                            <i class="fas fa-share-alt"></i>
                            Share
                        </button>
                        <a href="#" class="action-btn secondary" id="websiteBtn">
                            <i class="fas fa-globe"></i>
                            Portfolio
                        </a>
                    </div>

                    <div class="social-links">
                        <a href="#" class="social-link" id="socialLinkedin" title="LinkedIn">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                        <a href="#" class="social-link" id="socialEmail" title="Email">
                            <i class="fas fa-envelope"></i>
                        </a>
                        <a href="#" class="social-link" id="socialPhone" title="Phone">
                            <i class="fas fa-phone"></i>
                        </a>
                        <a href="#" class="social-link" id="socialWhatsapp" title="WhatsApp">
                            <i class="fab fa-whatsapp"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Action completed!</span>
    </div>

    <script>
        let cardData = {};

        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['rgba(255,255,255,0.1)', 'rgba(245,158,11,0.2)', 'rgba(239,68,68,0.2)'];
            const particleCount = window.innerWidth < 768 ? 8 : 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 80 + 40;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(particle);
            }
        }

        createParticles();

        async function fetchMainPageData() {
            try {
                const response = await fetch('../index.html');
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                cardData = {
                    name: doc.querySelector('.hero h1')?.textContent?.trim() || 
                          doc.querySelector('h1')?.textContent?.trim() || 
                          'Rishi Raje',
                    
                    title: doc.querySelector('.hero h3')?.textContent?.replace('I am', '')?.trim() ||
                           doc.querySelector('.hero-content p')?.textContent?.split('.')[0] ||
                           'Sales & Marketing Manager',
                    
                    company: 'WAL Developments',
                    
                    email: doc.querySelector('a[href^="mailto:"]')?.href?.replace('mailto:', '') || 
                           doc.querySelector('a[href^="mailto:"]')?.textContent?.trim() ||
                           'rishi_raje07@yahoo.co.uk',
                    
                    phone: doc.querySelector('a[href^="tel:"]')?.href?.replace('tel:', '') ||
                           doc.querySelector('.contact-details p')?.textContent?.match(/\+[\d-]+/)?.[0] ||
                           '+91-7388909494',
                    
                    location: doc.querySelector('.contact-details h3:contains("Address")')?.nextElementSibling?.textContent ||
                             'Gurgaon, India',
                    
                    linkedin: doc.querySelector('a[href*="linkedin"]')?.href || 
                             'https://www.linkedin.com/in/rishiraje',
                    
                    website: window.location.origin,
                    
                    stats: {
                        experience: doc.querySelector('.stat-card h2')?.textContent?.trim() || '12+',
                        campaigns: doc.querySelectorAll('.stat-card h2')?.[1]?.textContent?.trim() || '250+',
                        revenue: doc.querySelectorAll('.stat-card h2')?.[2]?.textContent?.trim() || '$370M+'
                    },

                    profileImage: doc.querySelector('.profile-img img')?.src || ''
                };

                const phoneNumber = cardData.phone.replace(/[^0-9]/g, '');
                cardData.whatsapp = `https://wa.me/${phoneNumber}`;

                return cardData;
            } catch (error) {
                console.error('Error fetching main page:', error);
                return {
                    name: 'Rishi Raje',
                    title: 'Sales & Marketing Manager',
                    company: 'WAL Developments',
                    email: 'rishi_raje07@yahoo.co.uk',
                    phone: '+91-7388909494',
                    location: 'Gurgaon, India',
                    linkedin: 'https://www.linkedin.com/in/rishiraje',
                    website: window.location.origin,
                    whatsapp: 'https://wa.me/917388909494',
                    stats: {
                        experience: '12+',
                        campaigns: '250+',
                        revenue: '$370M+'
                    },
                    profileImage: ''
                };
            }
        }

        function populateCard(data) {
            document.getElementById('name').textContent = data.name;
            document.getElementById('jobTitle').textContent = data.title;
            document.getElementById('company').textContent = data.company;

            document.getElementById('statExp').textContent = data.stats.experience;
            document.getElementById('statCampaigns').textContent = data.stats.campaigns;
            document.getElementById('statRevenue').textContent = data.stats.revenue;

            document.getElementById('phoneText').textContent = data.phone;
            document.getElementById('emailText').textContent = data.email;
            document.getElementById('locationText').textContent = data.location;

            document.getElementById('phoneLink').href = `tel:${data.phone}`;
            document.getElementById('emailLink').href = `mailto:${data.email}`;
            document.getElementById('linkedinBtn').href = data.linkedin;
            document.getElementById('websiteBtn').href = data.website;

            document.getElementById('socialLinkedin').href = data.linkedin;
            document.getElementById('socialEmail').href = `mailto:${data.email}`;
            document.getElementById('socialPhone').href = `tel:${data.phone}`;
            document.getElementById('socialWhatsapp').href = data.whatsapp;

            if (data.profileImage) {
                document.getElementById('profileImage').innerHTML = `<img src="${data.profileImage}" alt="${data.name}">`;
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('cardContent').style.display = 'block';
        }

        async function init() {
            const data = await fetchMainPageData();
            populateCard(data);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function saveContact() {
            const vCard = `BEGIN:VCARD
VERSION:3.0
FN:${cardData.name}
TITLE:${cardData.title}
ORG:${cardData.company}
TEL;TYPE=CELL:${cardData.phone}
EMAIL:${cardData.email}
ADR;TYPE=WORK:;;${cardData.location}
URL:${cardData.website}
URL:${cardData.linkedin}
NOTE:${cardData.stats.experience} experience | ${cardData.stats.campaigns} campaigns | ${cardData.stats.revenue} revenue
END:VCARD`;

            const blob = new Blob([vCard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${cardData.name.replace(/\s+/g, '')}_Contact.vcf`;
            link.click();
            URL.revokeObjectURL(url);
            showToast('Contact card downloaded!');
        }

        async function shareCard() {
            const shareData = {
                title: `${cardData.name} - Digital Business Card`,
                text: `${cardData.title} at ${cardData.company}. Let's connect!`,
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                    showToast('Card shared successfully!');
                } else {
                    await navigator.clipboard.writeText(window.location.href);
                    showToast('Link copied to clipboard!');
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('Share failed:', err);
                }
            }
        }

        function copyLocation(e) {
            e.preventDefault();
            navigator.clipboard.writeText(cardData.location).then(() => {
                showToast('Location copied!');
            }).catch(() => {
                showToast('Could not copy location');
            });
        }

        init();
    </script>
</body>
</html>
